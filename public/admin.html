<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>RSVP Admin — Samuditha &amp; Sajini</title>
<meta name="robots" content="noindex, nofollow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;0,700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<script src="https://cdn.tailwindcss.com"></script>
<script>
  tailwind.config = {
    theme: {
      extend: {
        colors: {
          maroon: { DEFAULT: '#5c0f1f', dark: '#3d0a15', light: '#7a1c2e' },
          gold: { DEFAULT: '#c9a24b', light: '#e6d4a3', dark: '#a37f2f' },
          ivory: '#fdf8ef'
        },
        fontFamily: {
          heading: ['"Cormorant Garamond"', 'serif'],
          body: ['"Poppins"', 'sans-serif']
        }
      }
    }
  }
</script>

<style>
  body { background-color: #fdf8ef; font-family: 'Poppins', sans-serif; color: #3d0a15; }
  h1, h2, .font-heading { font-family: 'Cormorant Garamond', serif; }
</style>
</head>
<body class="min-h-screen">

<div id="login-view" class="min-h-screen flex items-center justify-center p-6">
  <div class="w-full max-w-sm bg-white/80 border border-gold/40 rounded-xl shadow-lg p-8">
    <h1 class="font-heading text-3xl text-maroon text-center mb-1">RSVP Admin</h1>
    <p class="text-center text-sm text-maroon-light/70 mb-6">Sign in to view responses.</p>
    <form id="login-form" class="space-y-4">
      <input type="email" id="admin-email" placeholder="Email" autocomplete="username"
        class="w-full border border-gold/50 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-gold" required>
      <input type="password" id="admin-password" placeholder="Password" autocomplete="current-password"
        class="w-full border border-gold/50 rounded-lg px-4 py-2 focus:outline-none focus:ring-2 focus:ring-gold" required>
      <button type="submit" class="w-full bg-maroon text-ivory rounded-lg py-2 font-medium hover:bg-maroon-dark transition">
        Sign In
      </button>
      <p id="login-error" class="text-red-700 text-sm text-center hidden">Incorrect email or password.</p>
    </form>
  </div>
</div>

<div id="dashboard-view" class="hidden max-w-5xl mx-auto p-6">
  <div class="flex items-center justify-between mb-6 flex-wrap gap-3">
    <h1 class="font-heading text-3xl text-maroon">RSVP Responses</h1>
    <div class="flex gap-3">
      <button id="refresh-btn" class="border border-gold text-maroon-dark rounded-lg px-4 py-2 text-sm hover:bg-gold/10 transition">Refresh</button>
      <button id="export-btn" class="border border-gold text-maroon-dark rounded-lg px-4 py-2 text-sm hover:bg-gold/10 transition">Export CSV</button>
      <button id="logout-btn" class="text-sm text-maroon-light/70 hover:text-maroon underline">Log out</button>
    </div>
  </div>

  <div class="grid grid-cols-3 gap-4 mb-6">
    <div class="bg-white/80 border border-gold/30 rounded-xl p-4 text-center">
      <div class="text-2xl font-heading text-maroon" id="stat-total">0</div>
      <div class="text-xs text-maroon-light/70 uppercase tracking-wide">Responses</div>
    </div>
    <div class="bg-white/80 border border-gold/30 rounded-xl p-4 text-center">
      <div class="text-2xl font-heading text-maroon" id="stat-attending">0</div>
      <div class="text-xs text-maroon-light/70 uppercase tracking-wide">Attending</div>
    </div>
    <div class="bg-white/80 border border-gold/30 rounded-xl p-4 text-center">
      <div class="text-2xl font-heading text-maroon" id="stat-guests">0</div>
      <div class="text-xs text-maroon-light/70 uppercase tracking-wide">Total Guests</div>
    </div>
  </div>

  <div class="bg-white/80 border border-gold/30 rounded-xl overflow-hidden">
    <table class="w-full text-sm">
      <thead class="bg-maroon text-ivory">
        <tr>
          <th class="text-left px-4 py-3">Name</th>
          <th class="text-left px-4 py-3">Attending</th>
          <th class="text-left px-4 py-3">Guests</th>
          <th class="text-left px-4 py-3">Message</th>
          <th class="text-left px-4 py-3">Submitted</th>
          <th class="px-4 py-3"></th>
        </tr>
      </thead>
      <tbody id="rsvp-body"></tbody>
    </table>
    <p id="empty-msg" class="hidden text-center text-maroon-light/60 py-8">No RSVPs yet.</p>
  </div>
  <p id="load-error" class="hidden text-center text-red-700 text-sm mt-4"></p>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
  import {
    getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
  import {
    getFirestore, collection, getDocs, deleteDoc, doc
  } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-firestore.js";

  const firebaseConfig = {
    apiKey: "AIzaSyB4HbuV0MHMPGPLfiONFZohERM_yIwpl6Q",
    authDomain: "sajini-wedding.firebaseapp.com",
    projectId: "sajini-wedding",
    storageBucket: "sajini-wedding.firebasestorage.app",
    messagingSenderId: "1051300823674",
    appId: "1:1051300823674:web:b7f606a6cd868ce8b9b1c3",
    measurementId: "G-6TP4ZW65CB"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  const loginView = document.getElementById('login-view');
  const dashboardView = document.getElementById('dashboard-view');
  const loginForm = document.getElementById('login-form');
  const loginError = document.getElementById('login-error');
  const rsvpBody = document.getElementById('rsvp-body');
  const emptyMsg = document.getElementById('empty-msg');
  const loadError = document.getElementById('load-error');

  function escapeHtml(str) {
    return String(str).replace(/[&<>"']/g, (c) => ({
      '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
    }[c]));
  }

  function toDate(ts) {
    return ts && typeof ts.toDate === 'function' ? ts.toDate() : new Date(ts || Date.now());
  }

  async function loadRsvps() {
    loadError.classList.add('hidden');
    try {
      const snap = await getDocs(collection(db, 'rsvps'));
      const list = snap.docs.map((d) => ({ id: d.id, ...d.data() }));
      render(list);
    } catch (err) {
      loadError.textContent = `Couldn't load RSVPs: ${err.code || err.message}`;
      loadError.classList.remove('hidden');
    }
  }

  function render(list) {
    const attending = list.filter(r => r.attending === 'yes');
    const totalGuests = attending.reduce((sum, r) => sum + (Number(r.guests) || 0), 0);

    document.getElementById('stat-total').textContent = list.length;
    document.getElementById('stat-attending').textContent = attending.length;
    document.getElementById('stat-guests').textContent = totalGuests;

    rsvpBody.innerHTML = '';
    emptyMsg.classList.toggle('hidden', list.length > 0);

    list
      .slice()
      .sort((a, b) => toDate(b.submittedAt) - toDate(a.submittedAt))
      .forEach((r) => {
        const tr = document.createElement('tr');
        tr.className = 'border-t border-gold/20';
        tr.innerHTML = `
          <td class="px-4 py-3 font-medium">${escapeHtml(r.name)}</td>
          <td class="px-4 py-3">
            <span class="px-2 py-1 rounded-full text-xs ${r.attending === 'yes' ? 'bg-green-100 text-green-800' : 'bg-red-100 text-red-800'}">
              ${r.attending === 'yes' ? 'Yes' : 'No'}
            </span>
          </td>
          <td class="px-4 py-3">${escapeHtml(r.guests)}</td>
          <td class="px-4 py-3 max-w-xs truncate" title="${escapeHtml(r.message)}">${escapeHtml(r.message || '—')}</td>
          <td class="px-4 py-3 text-xs text-maroon-light/70">${toDate(r.submittedAt).toLocaleString()}</td>
          <td class="px-4 py-3 text-right">
            <button data-id="${r.id}" class="delete-btn text-red-700 hover:underline text-xs">Delete</button>
          </td>
        `;
        rsvpBody.appendChild(tr);
      });

    document.querySelectorAll('.delete-btn').forEach((btn) => {
      btn.addEventListener('click', async () => {
        if (!confirm('Delete this RSVP?')) return;
        await deleteDoc(doc(db, 'rsvps', btn.dataset.id));
        loadRsvps();
      });
    });

    window._rsvpList = list;
  }

  loginForm.addEventListener('submit', async (e) => {
    e.preventDefault();
    loginError.classList.add('hidden');
    const email = document.getElementById('admin-email').value;
    const password = document.getElementById('admin-password').value;
    try {
      await signInWithEmailAndPassword(auth, email, password);
    } catch (err) {
      loginError.classList.remove('hidden');
    }
  });

  onAuthStateChanged(auth, (user) => {
    if (user) {
      loginView.classList.add('hidden');
      dashboardView.classList.remove('hidden');
      loadRsvps();
    } else {
      dashboardView.classList.add('hidden');
      loginView.classList.remove('hidden');
    }
  });

  document.getElementById('refresh-btn').addEventListener('click', loadRsvps);

  document.getElementById('logout-btn').addEventListener('click', () => signOut(auth));

  document.getElementById('export-btn').addEventListener('click', () => {
    const list = window._rsvpList || [];
    const header = ['Name', 'Attending', 'Guests', 'Message', 'Submitted'];
    const rows = list.map(r => [r.name, r.attending, r.guests, r.message, toDate(r.submittedAt).toISOString()]
      .map(v => `"${String(v ?? '').replace(/"/g, '""')}"`).join(','));
    const csv = [header.join(','), ...rows].join('\n');
    const blob = new Blob([csv], { type: 'text/csv' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'rsvps.csv';
    a.click();
  });
</script>
</body>
</html>
